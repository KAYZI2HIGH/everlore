<svg viewBox="0 0 300 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="150" cy="140" r="120" fill="#f0fdf4" opacity="0.5"/>
  
  <!-- Shopping bag -->
  <g>
    <!-- Bag body -->
    <rect x="110" y="100" width="80" height="90" rx="8" fill="#f5f3ff" stroke="#16a34a" stroke-width="2"/>
    
    <!-- Bag handles -->
    <path d="M 120 100 Q 120 70 150 70 Q 180 70 180 100" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Bag shine/highlight -->
    <path d="M 125 110 Q 130 115 128 140" stroke="#22c55e" stroke-width="1.5" opacity="0.6" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Checkmark icon -->
  <g>
    <circle cx="200" cy="75" r="18" fill="#16a34a"/>
    <path d="M 195 75 L 200 82 L 210 68" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Empty state indicator - dashed circle -->
  <circle cx="150" cy="145" r="45" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
  
  <!-- Floating elements -->
  <g opacity="0.4">
    <!-- Small star -->
    <path d="M 80 120 L 85 130 L 95 130 L 87 135 L 90 145 L 80 140 L 70 145 L 73 135 L 65 130 L 75 130 Z" fill="#16a34a"/>
    
    <!-- Small circle -->
    <circle cx="240" cy="100" r="6" fill="#16a34a"/>
    
    <!-- Small square -->
    <rect x="70" y="200" width="12" height="12" fill="#16a34a" rx="2"/>
  </g>
  
  <!-- Text alternatives (could be replaced with actual text) -->
  <text x="150" y="250" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">Your cart is empty</text>
  <text x="150" y="270" font-size="11" text-anchor="middle" fill="#64748b">Start shopping to add courses</text>
</svg>
